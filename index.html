$("grid").onclick=e=>{const c=e.target.closest(".card");if(!c)return;const r=R[+c.dataset.i],d=$("dlg");d.style.setProperty("--c",CATS[r.c][1]);
$("dc").innerHTML=`<h2>${r.n}</h2><div class="fm">${sub(r.f)}</div><dl><dt>CAS</dt><dd>${r.cas||"Not recorded"}</dd><dt>Category</dt><dd>${CATS[r.c][0]}</dd><dt>Form</dt><dd>${r.s||"Not recorded"}</dd><dt>In stock</dt><dd>Not recorded yet</dd><dt>Shelf</dt><dd>Not recorded yet</dd></dl>${r.h?`<ul class="hz">${[...r.h].map(k=>`<li class="${"KTCX".includes(k)?"r":""}">${HZ[k][1]}</li>`).join("")}</ul>`:""}${r.v?`<p class="note">This entry still needs to be verified against the bottle label.</p>`:""}<p class="note">Consult the product SDS for handling, storage and disposal requirements.</p>`;d.showModal()};
$("q").oninput=e=>{q=e.target.value.trim();render()};
$("reset").onclick=()=>{q="";$("q").value="";cat=-1;hz.clear();document.querySelectorAll("#hz .chip").forEach(b=>b.setAttribute("aria-pressed","false"));sync();render()};
$("cl").onclick=()=>$("dlg").close();
$("dlg").onclick=e=>{if(e.target.id==="dlg")e.target.close()};
document.addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement.tagName!=="INPUT"){e.preventDefault();$("q").focus()}});
render();
// rising bubbles
(function(){const c=$("fx"),x=c.getContext("2d");let W,H,B=[];function rs(){W=c.width=innerWidth;H=c.height=innerHeight}rs();addEventListener("resize",rs);
for(let i=0;i<34;i++)B.push({x:Math.random()*W,y:Math.random()*H,r:2+Math.random()*7,v:.25+Math.random()*.6,p:Math.random()*6});
const still=matchMedia("(prefers-reduced-motion:reduce)").matches;
function f(t){x.clearRect(0,0,W,H);const rgb=getComputedStyle(document.documentElement).getPropertyValue("--bub").trim()||"34,228,255";
B.forEach(b=>{if(!still){b.y-=b.v;b.x+=Math.sin(t/900+b.p)*.3;if(b.y<-10){b.y=H+10;b.x=Math.random()*W}}
x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.strokeStyle=`rgba(${rgb},.35)`;x.lineWidth=1.2;x.stroke();x.fillStyle=`rgba(${rgb},.05)`;x.fill()});
if(!still)requestAnimationFrame(f)}
requestAnimationFrame(f)})();
</script>
