let R=[],CATS=[],cat=-1,hz=new Set,q="",cb=[];
function parseCSV(t){const rows=[];let r=[],c="",o=false;for(let i=0;i<t.length;i++){const ch=t[i];if(o){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else o=false}else c+=ch}else if(ch=='"')o=true;else if(ch==","){r.push(c);c=""}else if(ch=="\n"||ch=="\r"){if(ch=="\r"&&t[i+1]=="\n")i++;r.push(c);c="";rows.push(r);r=[]}else c+=ch}if(c||r.length){r.push(c);rows.push(r)}return rows}
function fail(m){$("grid").innerHTML=`<div class="empty" style="grid-column:1/-1">${m}</div>`;$("count").textContent=""}
function use(t,mode){
const rows=parseCSV(t),hi=rows.findIndex(r=>r.some(c=>/material name/i.test(c)));
if(hi<0)return fail("<p>The spreadsheet was loaded but the column headers were not found.</p><p>Keep the original header row (Category, Material Name, English Name, …).</p>");
const h=rows[hi].map(x=>x.trim().toLowerCase()),ix=k=>h.findIndex(x=>x.startsWith(k));
const I={cat:ix("category"),n:ix("english name"),m:ix("material name"),f:ix("exact chemical"),cas:ix("cas"),s:ix("physical"),mf:ix("manufacturer"),q:ix("quantity"),sh:ix("shelf"),sds:ix("safety")};
const g=(a,k)=>I[k]>=0?(a[I[k]]||"").trim():"";
CATS=[];R=[];
rows.slice(hi+1).forEach(a=>{let n=g(a,"n")||g(a,"m");if(!n)return;
const v=/\((to verify|incomplete[^)]*|duplicate entry)\)/i.test(n);n=n.replace(/\s*\((to verify|incomplete[^)]*|duplicate entry)\)/ig,"");
const cn=SN[g(a,"cat")]||g(a,"cat")||"Other";let c=CATS.findIndex(x=>x[0]===cn);if(c<0){CATS.push([cn,PAL[CATS.length%PAL.length]]);c=CATS.length-1}
const sds=g(a,"sds"),l=sds.toLowerCase(),f=g(a,"f"),cas=g(a,"cas");
R.push({n,f,cas,c,s:g(a,"s"),mf:g(a,"mf"),qty:g(a,"q"),sh:g(a,"sh"),sds,v,h:RULES.filter(x=>x[1].test(l)).map(x=>x[0]).join(""),hay:(n+" "+f.replace(/[.\s]/g,"")+" "+cas+" "+g(a,"sh")).toLowerCase()})});
R.sort((a,b)=>a.n.localeCompare(b.n));
$("s1").textContent=R.length;$("s2").textContent=CATS.length;
$("s3").textContent=R.filter(r=>[...r.h].some(x=>RED.includes(x))).length;$("s4").textContent=R.filter(r=>r.v).length;
const box=$("cats");box.innerHTML="";cb=[chip(box,"All","",()=>{cat=-1;sync()})];
CATS.forEach((c,i)=>cb.push(chip(box,c[0],c[1],()=>{cat=i;sync()})));if(cat>=CATS.length)cat=-1;sync();
$("upd").textContent="Inventory updated 18 Oct 2026";
render()}
function load(){use(DATA,"embedded")}
function chip(box,label,col,on){const b=document.createElement("button");b.className="chip";b.textContent=label;b.setAttribute("aria-pressed","false");if(col)b.style.setProperty("--c",col);b.onclick=()=>{on(b);render()};box.appendChild(b);return b}
function sync(){cb.forEach((b,i)=>b.setAttribute("aria-pressed",i===cat+1))}
Object.keys(HZ).filter(k=>"OTCFKX".includes(k)).forEach(k=>chip($("hz"),HZ[k],"",b=>{hz.has(k)?hz.delete(k):hz.add(k);b.setAttribute("aria-pressed",hz.has(k))}));
function pills(r){const ks=[...r.h].filter(k=>"OTCFKXWS".includes(k)),m=ks.slice(0,3);let h=m.map(k=>`<span class="pill ${"KTCX".includes(k)?"r":""}">${HZ[k]}</span>`).join("");if(ks.length>3)h+=`<span class="pill g">+${ks.length-3}</span>`;if(r.v)h+=`<span class="pill v">To verify</span>`;return h}
function render(){
if(!R.length)return;
const t=q.toLowerCase().split(/\s+/).filter(Boolean).map(x=>x.replace(/\./g,""));
const L=R.filter(r=>(cat<0||r.c===cat)&&[...hz].every(k=>r.h.includes(k))&&t.every(x=>r.hay.includes(x)));
$("count").textContent=L.length+" of "+R.length+" chemicals";
$("reset").hidden=!(q||cat>=0||hz.size);
$("grid").innerHTML=L.length?L.map(r=>`<button class="card" style="--c:${CATS[r.c][1]}" data-i="${R.indexOf(r)}"><h3>${esc(r.n)}</h3><div class="fm">${sub(r.f)}</div><div class="cas">${r.cas?"CAS "+esc(r.cas):"CAS not recorded"}${r.qty?" · Qty "+esc(r.qty):""}${r.sh?" · Shelf "+esc(r.sh):""}</div><div class="pills">${pills(r)}</div></button>`).join(""):`<div class="empty" style="grid-column:1/-1"><p style="font-size:1.1rem">No chemical matches "${esc(q)}".</p><p>Check the spelling, try the formula, or clear the filters.</p></div>`}
$("grid").onclick=e=>{const c=e.target.closest(".card");if(!c)return;const r=R[+c.dataset.i],d=$("dlg");d.style.setProperty("--c",CATS[r.c][1]);
const ss=[...new Set(r.sds.split(/(?<=\.)\s+/).filter(x=>x&&!/^consult the product sds/i.test(x)))],nr=x=>x||"Not recorded yet";
$("dc").innerHTML=`<h2>${esc(r.n)}</h2><div class="fm">${sub(r.f)}</div><dl><dt>CAS</dt><dd>${esc(r.cas||"Not recorded")}</dd><dt>Category</dt><dd>${esc(CATS[r.c][0])}</dd><dt>Form</dt><dd>${esc(nr(r.s))}</dd><dt>Manufacturer</dt><dd>${esc(nr(r.mf))}</dd><dt>In stock</dt><dd>${esc(nr(r.qty))}</dd><dt>Shelf</dt><dd>${esc(nr(r.sh))}</dd></dl>${ss.length?`<ul class="hz">${ss.map(x=>`<li class="${/toxic|carcinogen|corrosive/i.test(x)?"r":""}">${esc(x)}</li>`).join("")}</ul>`:""}${r.v?`<p class="note">This entry still needs to be verified against the bottle label.</p>`:""}<p class="note">Consult the product SDS for handling, storage and disposal requirements.</p>`;d.showModal()};
$("q").oninput=e=>{q=e.target.value.trim();render()};
$("reset").onclick=()=>{q="";$("q").value="";cat=-1;hz.clear();document.querySelectorAll("#hz .chip").forEach(b=>b.setAttribute("aria-pressed","false"));sync();render()};
$("cl").onclick=()=>$("dlg").close();
$("dlg").onclick=e=>{if(e.target.id==="dlg")e.target.close()};
document.addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement.tagName!=="INPUT"){e.preventDefault();$("q").focus()}});
fail("<p>Loading inventory…</p>");load();
// rising bubbles
(function(){const c=$("fx"),x=c.getContext("2d");let W,H,B=[];function rs(){W=c.width=innerWidth;H=c.height=innerHeight}rs();addEventListener("resize",rs);
for(let i=0;i<34;i++)B.push({x:Math.random()*W,y:Math.random()*H,r:2+Math.random()*7,v:.25+Math.random()*.6,p:Math.random()*6});
const still=matchMedia("(prefers-reduced-motion:reduce)").matches;
function f(t){x.clearRect(0,0,W,H);const rgb=getComputedStyle(document.documentElement).getPropertyValue("--bub").trim()||"34,228,255";
B.forEach(b=>{if(!still){b.y-=b.v;b.x+=Math.sin(t/900+b.p)*.3;if(b.y<-10){b.y=H+10;b.x=Math.random()*W}}
x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.strokeStyle=`rgba(${rgb},.35)`;x.lineWidth=1.2;x.stroke();x.fillStyle=`rgba(${rgb},.05)`;x.fill()});
if(!still)requestAnimationFrame(f)}
requestAnimationFrame(f)})();
</script>
</body>
</html>
